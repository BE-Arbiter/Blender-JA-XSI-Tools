name: CI

on:
  # Deliberately no `branches: [ master ]` push trigger: PRs already run smoke-test/typecheck
  # before merge, and potential race conditions between parallel PRs will be caught on nightly/release.
  push:
    tags: [ "v*.*.*" ]
  pull_request:
  schedule:
    # Daily, off-peak minute rather than top-of-hour: GitHub Actions schedules cluster at round
    # minutes/top-of-hour across all repos, causing extra queueing delay.
    - cron: "23 3 * * *"
  workflow_dispatch:

# Read-only by default; only the publishing jobs below get write access (new repos' default
# GITHUB_TOKEN is read-only, which made the first release fail with 403).
permissions:
  contents: read

jobs:
  check-nightly-needed:
    # Always runs (cheap, no checkout) regardless of trigger: if it were skipped by its own `if:`
    # on other triggers, the jobs `needs`-ing it would be auto-skipped too (GitHub Actions treats
    # "skipped" as not-succeeded for needs), blocking PRs, tag pushes and manual dispatches.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check whether master has new commits since the last nightly attempt
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against nightly-attempted (moved unconditionally as nightly's first step), not the
          # nightly tag (moved only on success): a failure is tried once, then left alone until
          # master actually moves, instead of being retried every night.
          attempted_sha="$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly-attempted" --jq .object.sha 2>/dev/null || true)"
          if [ "$attempted_sha" = "$GITHUB_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  smoke-test:
    if: |
      github.event_name != 'schedule' || needs.check-nightly-needed.outputs.changed == 'true'
    needs: [ check-nightly-needed ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 is the minimum version declared in __init__.py's bl_info (legacy Action.fcurves
        # API); 5.2 the latest (slotted actions, legacy API removed). Both code paths are covered.
        blender-version: ["4.1", "5.2"]
    container:
      image: blenderkit/headless-blender:blender-${{ matrix.blender-version }}-stable
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite in headless Blender
        run: /home/headless/blender/blender --background --python-exit-code 1 --python tests/run_tests.py

  typecheck:
    if: |
      github.event_name != 'schedule' || needs.check-nightly-needed.outputs.changed == 'true'
    needs: [ check-nightly-needed ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: the 20260730 build types Context.scene & co. as methods, which fails every access.
      - run: pip install pyright fake-bpy-module-4.5==20260128
      - run: pyright --pythonpath "$(command -v python3)"

  pep8:
    if: |
      github.event_name != 'schedule' || needs.check-nightly-needed.outputs.changed == 'true'
    needs: [ check-nightly-needed ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pycodestyle
      - run: make pep8

  nightly:
    # Only on schedule (and only if master moved since the last attempt) or manual dispatch,
    # once smoke-test/typecheck/pep8 passed.
    if: |
      (github.event_name == 'schedule' && needs.check-nightly-needed.outputs.changed == 'true') ||
      github.event_name == 'workflow_dispatch'
    needs: [ smoke-test, typecheck, pep8, check-nightly-needed ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the nightly tags, publishes the prerelease
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Mark this commit as attempted
        # First step, before anything that could fail (see check-nightly-needed).
        run: |
          git tag -f nightly-attempted
          git push --force origin nightly-attempted
      - name: Create build dir
        run: mkdir -p build
      - name: Compile Manual
        # TODO: run `make build/ja_xsi_tools_doc.pdf` instead, but that requires pdflatex
        uses: dante-ev/latex-action@latest
        with:
          working_directory: build
          root_file: ../ja_xsi_tools_doc.tex
      - name: Package plugin
        run: make build/Blender_JA_dotXSI_Tools.zip
      - name: Extract latest commit message
        id: notes
        run: |
          {
            echo "body<<NIGHTLY_NOTES_EOF"
            git log -1 --format=%B
            echo "NIGHTLY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        # move the nightly tag so the right source code is attached to the release
      - name: Update nightly tag
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: "tags/nightly", sha: context.sha, force: true
              })
            } catch (e) {
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: "refs/tags/nightly", sha: context.sha
              })
            }
      - name: Release nightly
        uses: softprops/action-gh-release@v2
        with:
          name: nightly
          tag_name: nightly
          prerelease: true
          body: |
            Automatic pre-release build.

            Latest change:

            ${{ steps.notes.outputs.body }}

            Install Blender_JA_dotXSI_Tools.zip with the "Install from Disk" button in Blender's add-on preferences.

            Please consult ja_xsi_tools_doc.pdf for instructions on how to use the add-on.
          files: |
            build/ja_xsi_tools_doc.pdf
            build/Blender_JA_dotXSI_Tools.zip

  release:
    # Only for vX.Y.Z tag pushes, once smoke-test/typecheck/pep8 passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ smoke-test, typecheck, pep8 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the release
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        # .claude/skills/release/tag_release.sh runs this same check before creating the tag.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Create build dir
        run: mkdir -p build
      - name: Compile Manual
        # TODO: run `make build/ja_xsi_tools_doc.pdf` instead, but that requires pdflatex
        uses: dante-ev/latex-action@latest
        with:
          working_directory: build
          root_file: ../ja_xsi_tools_doc.tex
      - name: Package plugin
        run: make build/Blender_JA_dotXSI_Tools.zip

      - name: Extract release notes from tagged commit
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            git log -1 --format=%B "$GITHUB_SHA"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ${{ steps.notes.outputs.body }}

            Install Blender_JA_dotXSI_Tools.zip with the "Install from Disk" button in Blender's add-on preferences.

            Please consult ja_xsi_tools_doc.pdf for instructions on how to use the add-on.
          files: |
            build/ja_xsi_tools_doc.pdf
            build/Blender_JA_dotXSI_Tools.zip
